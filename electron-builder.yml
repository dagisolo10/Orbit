appId: com.dagidev.orbit
productName: Orbit
copyright: Copyright © 2026 Dagmawi Solomon
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
    - resources/**
win:
    executableName: Orbit
nsis:
    artifactName: ${productName}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
mac:
    category: public.app-category.developer-tools
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - NSCameraUsageDescription: Application requests access to the device's camera.
        - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
        - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
        - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    notarize: false
dmg:
    artifactName: ${productName}-${version}.${ext}
linux:
    target:
        - AppImage
        - deb
        - pacman
    maintainer: Dagmawi Solomon <dagisolo1023@gmail.com>
    category: Development
    syncDesktopName: true
    synopsis: Local project workspace for developers
    description: Orbit scans a directory on your machine, detects the technologies each project uses, and presents everything in a fast, searchable, offline dashboard.
appImage:
    artifactName: ${productName}-${version}.${ext}
deb:
    artifactName: ${productName}-${version}.${ext}
pacman:
    packageName: orbit
    artifactName: ${productName}-${version}.${ext}
    depends:
        - c-ares
        - ffmpeg
        - gtk3
        - libevent
        - libvpx
        - libxslt
        - libxss
        - minizip
        - nss
        - re2
        - snappy
        - libnotify
        - libayatana-appindicator
npmRebuild: false
publish:
    provider: generic
    url: https://dagidev.com/orbit/updates
